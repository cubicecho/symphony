fragment UpstreamFields on Upstream {
  id
  name
  url
  proxyPath
  builtIn
  discoveredKey
  headers {
    name
    value
  }
  schema {
    typeCount
    fetchedAt
    hash
  }
}

query Upstreams {
  upstreams {
    ...UpstreamFields
  }
}

query UpstreamSchema($id: ID!) {
  upstream(id: $id) {
    id
    schema {
      sdl
    }
  }
}

mutation AddUpstream($input: AddUpstreamInput!) {
  addUpstream(input: $input) {
    ...UpstreamFields
  }
}

mutation UpdateUpstream($input: UpdateUpstreamInput!) {
  updateUpstream(input: $input) {
    ...UpstreamFields
  }
}

mutation DeleteUpstream($id: ID!) {
  deleteUpstream(id: $id)
}

mutation RefreshSchema($id: ID!) {
  refreshSchema(id: $id) {
    ...UpstreamFields
  }
}

query LanDiscovery {
  lanDiscovery {
    enabled
    upstreams {
      key
      serviceName
      title
      description
      url
      requiredHeaders
      host
      state
      upstream {
        id
        name
      }
    }
  }
}

mutation AddDiscoveredUpstream($input: AddDiscoveredUpstreamInput!) {
  addDiscoveredUpstream(input: $input) {
    ...UpstreamFields
  }
}
